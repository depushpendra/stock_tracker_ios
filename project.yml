name: StockTracker
options:
  bundleIdPrefix: com.stocktracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  transitivelyLinkDependencies: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
# Local Swift packages (path-based). Only the StockTracker app target lives outside Packages/.
packages:
  Domain:
    path: Packages/Domain
  Core:
    path: Packages/Core
  Data:
    path: Packages/Data
  Localization:
    path: Packages/Localization
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features
  Bootstrap:
    path: Packages/Bootstrap
  TestSupport:
    path: Packages/TestSupport
targets:
  StockTracker:
    type: application
    platform: iOS
    sources:
      - path: StockTrackerApp
        excludes:
          - "**/.DS_Store"
    resources:
      - path: StockTrackerApp/AppConfig.plist
      - path: StockTrackerApp/PrivacyInfo.xcprivacy
    info:
      path: StockTrackerApp/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stocktracker.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Bootstrap
      - package: DesignSystem
  StockTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StockTrackerUITests
    dependencies:
      - target: StockTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stocktracker.app.uitests
        TEST_TARGET_NAME: StockTracker
schemes:
  StockTracker:
    build:
      targets:
        StockTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StockTrackerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
