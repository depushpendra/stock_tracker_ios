disabled_rules:
  - trailing_whitespace
  - todo
opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - overridden_super_call
  - private_action
  - redundant_nil_coalescing
included:
  - StockTrackerApp
  - StockTrackerUITests
  - Packages/*/Sources
excluded:
  - Packages/*/.build
  - "**/.build"
line_length:
  warning: 140
  error: 180
type_body_length:
  warning: 300
file_length:
  warning: 500
identifier_name:
  min_length: 2
  excluded:
    - v
